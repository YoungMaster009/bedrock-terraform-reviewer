name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # read the code, nothing else; no AWS access needed

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # same version as the laptop
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
